<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Startup Agent - UI</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a33;
        --panel2: #0f1730;
        --text: #e8ecff;
        --muted: #aab2d5;
        --accent: #6ea8fe;
        --accent2: #7cf6c3;
        --danger: #ff6b6b;
        --border: rgba(255, 255, 255, 0.12);
      }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: radial-gradient(1000px 600px at 20% 0%, #1b2a66 0%, var(--bg) 55%);
        color: var(--text);
      }

      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 18px 46px;
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      h1 {
        font-size: 20px;
        margin: 0;
        letter-spacing: 0.2px;
      }

      .sub {
        color: var(--muted);
        font-size: 13px;
        margin-top: 6px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        gap: 14px;
      }

      @media (max-width: 980px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      }

      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 10px;
      }

      .label {
        font-size: 12px;
        color: var(--muted);
      }

      textarea {
        width: 100%;
        min-height: 110px;
        resize: vertical;
        padding: 12px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.22);
        color: var(--text);
        outline: none;
        line-height: 1.35;
      }

      textarea:focus {
        border-color: rgba(110, 168, 254, 0.8);
        box-shadow: 0 0 0 3px rgba(110, 168, 254, 0.18);
      }

      .btn {
        cursor: pointer;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(110, 168, 254, 0.15);
        color: var(--text);
        font-weight: 600;
      }

      .btn.primary {
        background: linear-gradient(135deg, rgba(110, 168, 254, 0.28), rgba(124, 246, 195, 0.18));
        border-color: rgba(124, 246, 195, 0.35);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .pill {
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.2);
        padding: 8px 10px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 3px rgba(110, 168, 254, 0.2);
      }

      .dot.ok {
        background: var(--accent2);
        box-shadow: 0 0 0 3px rgba(124, 246, 195, 0.2);
      }

      .dot.bad {
        background: var(--danger);
        box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.2);
      }

      .out {
        white-space: pre-wrap;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.22);
        padding: 12px;
        min-height: 330px;
      }

      .out h2 {
        margin: 0 0 8px;
        font-size: 14px;
        color: var(--muted);
      }

      .muted {
        color: var(--muted);
      }

      .footer {
        margin-top: 12px;
        font-size: 12px;
        color: var(--muted);
      }

      code.k {
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid var(--border);
        padding: 2px 6px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>Startup Agent UI</h1>
          <div class="sub">Type / paste your idea and iteratively ask for a better startup brief.</div>
        </div>
        <div class="pill">
          <div class="status">
            <span id="dot" class="dot"></span>
            <span id="status">Ready</span>
          </div>
        </div>
      </header>

      <div class="grid">
        <section class="card">
          <div class="row">
            <div class="label">Startup idea</div>
          </div>
          <textarea id="idea" placeholder="e.g., An app that helps freelancers manage invoices and get paid faster"></textarea>

          <div class="row" style="margin-top: 12px;">
            <div class="label">Extra info / new details (optional)</div>
          </div>
          <textarea id="extra" placeholder="Add constraints, target industry, pricing guess, geography, etc."></textarea>

          <div class="row" style="margin-top: 12px; justify-content: space-between;">
            <div class="row" style="margin-bottom: 0;">
              <label class="label" for="model">Model</label>
              <select
                id="model"
                style="background: rgba(0,0,0,0.22); border:1px solid var(--border); color: var(--text); border-radius:12px; padding:10px; outline:none;"
              >
                <option value="llama3.2:latest" selected>llama3.2:latest</option>
                <option value="minimax-m2.5:cloud">minimax-m2.5:cloud</option>
                <option value="kimi-k2.5:cloud">kimi-k2.5:cloud</option>
              </select>
            </div>

            <button id="btn" class="btn primary">Generate / Update Brief</button>
          </div>

          <div class="footer">
            This UI expects a local backend at <code class="k">/api/startup-brief</code>.
          </div>
        </section>

        <section class="card">
          <div class="out">
            <h2>Startup Brief Output</h2>
            <div id="output" class="muted">Run generation to see results here...</div>
          </div>
        </section>
      </div>
    </div>

    <script>
      const dot = document.getElementById('dot');
      const statusEl = document.getElementById('status');
      const ideaEl = document.getElementById('idea');
      const extraEl = document.getElementById('extra');
      const outputEl = document.getElementById('output');
      const btn = document.getElementById('btn');
      const modelEl = document.getElementById('model');

      function setStatus(text, kind) {
        statusEl.textContent = text;
        dot.classList.remove('ok', 'bad');
        if (kind === 'ok') dot.classList.add('ok');
        if (kind === 'bad') dot.classList.add('bad');
      }

      async function run() {
        const payload = {
          idea: ideaEl.value || '',
          extra: extraEl.value || '',
          model: modelEl.value || 'llama3.2:latest',
        };

        if (!payload.idea.trim()) {
          setStatus('Add an idea first', 'bad');
          return;
        }

        setStatus('Generating...', '');
        btn.disabled = true;
        outputEl.textContent = 'Generating...';

        try {
          const res = await fetch('/api/startup-brief', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          if (!res.ok) {
            const txt = await res.text();
            throw new Error(`HTTP ${res.status}: ${txt}`);
          }

          const data = await res.json();
          outputEl.textContent = data.output || JSON.stringify(data, null, 2);
          setStatus('Done', 'ok');
        } catch (e) {
          setStatus('Error', 'bad');
          outputEl.textContent = String(e?.message || e);
        } finally {
          btn.disabled = false;
        }
      }

      btn.addEventListener('click', run);
    </script>
  </body>
</html>
